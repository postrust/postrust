# cargo-audit configuration.
#
# Every entry below is an advisory we have decided not to act on *yet*, with
# the reason. The list is deliberately short and deliberately annotated: an
# ignore list without reasons becomes a place advisories go to be forgotten.
#
# The bar for adding an entry is a reachability argument, not inconvenience.
# `cargo audit` reports what is in Cargo.lock, which is not the same as what is
# compiled -- an advisory against an optional dependency that no enabled
# feature pulls in has no code path to reach. Check with:
#
#     cargo tree -i <crate>
#
# "nothing to print" means the crate is locked but never built. SECURITY.md
# explains this at more length.

[advisories]
ignore = [
    # rsa 0.9.9 -- Marvin attack, timing side channel in PKCS#1 v1.5
    # decryption.
    #
    # Not in any native build graph: `cargo tree -i rsa` prints nothing. It is
    # an optional dependency of sqlx behind the MySQL feature, which this
    # workspace does not enable -- postrust is PostgreSQL only.
    #
    # On wasm32 it *is* compiled (`cargo tree -i rsa --target
    # wasm32-unknown-unknown`), and so is it natively under postrust-auth's
    # test-only `jwt-rust-crypto` feature: jsonwebtoken 10's `rust_crypto`
    # feature, which the Cloudflare Worker build uses (issue #50), brings it in
    # for the RSA algorithms whether or not they are used. They are not:
    # postrust accepts HS256 tokens only (`Validation::new(Algorithm::HS256)`
    # in postrust-auth's jwt.rs), so no rsa code is reachable. Even an RSA
    # verification would use only a public key, and the advisory is about the
    # timing of PKCS#1 v1.5 *decryption* with a private key, which postrust
    # never holds or performs.
    #
    # There is also no fixed version to move to; the advisory lists no patched
    # release, because the fix requires an API change upstream has not made.
    # Revisit if sqlx ever gains a mandatory RSA path.
    "RUSTSEC-2023-0071",

    # crypto-bigint 0.5.5 -- timing variability in operations meant to be
    # constant-time.
    #
    # Not in the native build graph of any shipped binary: `cargo tree -i
    # crypto-bigint` prints nothing. It is compiled by the same routes as rsa
    # above -- on wasm32, and natively under postrust-auth's test-only
    # `jwt-rust-crypto` feature: jsonwebtoken 10's `rust_crypto` feature
    # brings in p256 and p384 for the ES256 and ES384 algorithms, and they
    # depend on elliptic-curve 0.13 and crypto-bigint 0.5. postrust accepts
    # HS256 tokens only, which is HMAC and uses no big-integer arithmetic, so
    # no affected operation runs. An ECDSA verification would use only public
    # values -- the key, the signature, the message -- and the advisory
    # concerns operations on secret integers.
    #
    # The fix is in crypto-bigint 0.7.6, which the p256 0.13 line cannot take;
    # jsonwebtoken 11 still depends on p256 0.13. Revisit when jsonwebtoken
    # moves to p256 0.14, or if postrust ever accepts an EC algorithm.
    "RUSTSEC-2026-0387",

    # rustls-pemfile 2.2.0 -- unmaintained.
    #
    # Genuinely compiled and used, in `tls::server` and `tls::acme`, to parse
    # PEM certificate chains and private keys. Unmaintained because rustls
    # moved PEM parsing into `rustls-pki-types`, which is already in the tree.
    #
    # Migrating is the right fix and is not risky, but it touches the code path
    # that loads the HTTPS listener's certificate, so it deserves its own
    # change with its own testing rather than being bundled into an audit pass.
    "RUSTSEC-2025-0134",

    # libsqlite3-sys 0.30.1 -- RUSTSEC-2026-0459, bundled C SQLite
    # vulnerability (CVE-2026-119375). Fixed in libsqlite3-sys >=0.39.0.
    #
    # Not in any build graph: `cargo tree -i libsqlite3-sys --target all`
    # prints nothing. It is locked only as an optional dependency of
    # sqlx-sqlite behind sqlx's SQLite feature, which this workspace does not
    # enable -- postrust is PostgreSQL only and never links or bundles SQLite.
    #
    # Not fixable by a lockfile update: sqlx-sqlite 0.9 requires
    # `libsqlite3-sys >=0.30.1, <0.38.0`, so the newest version the lockfile
    # can reach (0.37.0) is still below the fix. Revisit when sqlx-sqlite
    # allows libsqlite3-sys >=0.39.
    "RUSTSEC-2026-0459",

    # chrono 0.4.42 -- RUSTSEC-2026-0543, unmaintained.
    #
    # Genuinely compiled: `cargo tree -i chrono --edges normal` lists
    # async-graphql, postrust-auth, postrust-core and sqlx-postgres. It is a
    # maintenance notice, not a vulnerability, and the advisory lists no
    # patched release (0.4.45, the latest, is flagged too). Replacing it means
    # moving off chrono in our own timestamp handling and waiting for
    # async-graphql and sqlx to do the same, which is not an audit-pass change.
    # Revisit when a maintained successor is adopted by sqlx or async-graphql.
    "RUSTSEC-2026-0543",
]
