[package]
name = "postrust-lambda"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "AWS Lambda adapter for Postrust, serving its REST and GraphQL APIs over PostgreSQL"
homepage.workspace = true
readme = "README.md"
keywords = ["lambda", "serverless", "aws", "postgres", "api"]

[[bin]]
name = "postrust-lambda"
path = "src/main.rs"

[dependencies]
# AWS Lambda
lambda_http = "0.14"
lambda_runtime = "0.14"

# Async
tokio.workspace = true
async-trait.workspace = true

# Database
sqlx.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true

# Error handling
thiserror.workspace = true
# Utilities
tracing.workspace = true
tracing-subscriber.workspace = true
bytes.workspace = true
http.workspace = true

anyhow.workspace = true

# Internal
postrust-server = { workspace = true, features = ["graphql"] }
postrust-core.workspace = true
postrust-sql.workspace = true
postrust-auth.workspace = true
postrust-response.workspace = true

[features]
default = []
# The admin UI (Swagger, Scalar, the GraphQL playground) at `/admin`. Off by
# default: a function is billed for its size on every cold start, and the UI is
# a development tool.
admin-ui = ["postrust-server/admin-ui"]

[dev-dependencies]
pretty_assertions.workspace = true
