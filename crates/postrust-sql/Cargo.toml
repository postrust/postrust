[package]
name = "postrust-sql"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Type-safe SQL fragment and statement builder used by Postrust"
homepage.workspace = true
readme = "README.md"
keywords = ["sql", "postgres", "query-builder", "sql-builder"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
bytes.workspace = true
chrono.workspace = true
uuid.workspace = true

# On wasm32, uuid's v4 needs a source of randomness, which comes from the
# JavaScript host (a Cloudflare Worker). See issue #50. chrono's clock comes
# from there too, through its default `wasmbind` feature.
[target.'cfg(target_arch = "wasm32")'.dependencies]
uuid = { workspace = true, features = ["js"] }

[dev-dependencies]
pretty_assertions.workspace = true
