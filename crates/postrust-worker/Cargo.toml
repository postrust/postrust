[package]
name = "postrust-worker"
# Deliberately NOT `version.workspace = true`. This adapter is a stub, and the
# rest of the workspace is heading for 1.0.0. See docs/stability.md.
version = "0.5.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Cloudflare Workers adapter for Postrust, for edge REST APIs over PostgreSQL"
homepage.workspace = true
readme = "README.md"
keywords = ["cloudflare", "workers", "edge", "postgres", "wasm"]

[lib]
crate-type = ["cdylib"]

[dependencies]
# Cloudflare Workers
worker = "0.4"

# Async
async-trait.workspace = true
futures.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true

# Error handling
thiserror.workspace = true

# Internal
postrust-core.workspace = true
postrust-sql.workspace = true
postrust-auth.workspace = true
postrust-response.workspace = true

[dev-dependencies]
pretty_assertions.workspace = true
