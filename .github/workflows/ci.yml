name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No channel named here: rust-toolchain.toml is the single place the
      # version lives, so this job and a contributor run the same clippy.
      # With `-D warnings` a version difference is a failure only one of them
      # can see. rustup installs the pinned toolchain, and the components that
      # file declares, on first use.
      - name: Install Rust (from rust-toolchain.toml)
        run: rustup show active-toolchain

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy (workspace, default features)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Clippy (server, admin-ui feature)
        run: cargo clippy -p postrust-server --features admin-ui --all-targets -- -D warnings

  msrv:
    name: MSRV (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The version here must match [workspace.package] rust-version. It is
      # verified rather than aspirational: 1.87.0 is refused outright, because
      # hickory 0.26 and time 0.3.55 declare 1.88. Without this job the
      # declared MSRV is a comment -- the README claimed 1.78, the docs 1.75,
      # and nothing caught either.
      - name: Install Rust 1.88
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88"

      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv

      # --locked: an MSRV check that lets cargo pick newer dependencies is
      # checking a different dependency set than the one that ships.
      - name: Check (workspace)
        run: cargo +1.88 check --workspace --all-targets --locked

  wasm32:
    name: wasm32 (Cloudflare Workers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (from rust-toolchain.toml) and the wasm32 target
        run: |
          rustup show active-toolchain
          rustup target add wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm32

      # The crates a Worker is built from (issue #50). `--locked` for the same
      # reason as the MSRV job.
      - name: Clippy (core crates and the Worker, wasm32)
        run: >
          cargo clippy --locked --target wasm32-unknown-unknown --no-default-features
          -p postrust-core -p postrust-sql -p postrust-auth -p postrust-response
          -p postrust-engine -p postrust-worker -- -D warnings

      # A crate that compiles C (ring, aws-lc-sys), needs tokio's networking
      # (mio) or is sqlx can build here by accident -- the runner has clang --
      # and still fail where a Worker is built. None of them may be in the
      # wasm32 graph at all. The graph is listed once and searched, rather
      # than asked about each crate with `cargo tree -i`: that fails outright
      # when two versions of a crate are locked ("specification is
      # ambiguous"), and a failure must not read as "absent".
      - name: No native-only crates in the wasm32 graph
        run: |
          status=0
          for package in postrust-engine postrust-worker; do
            graph=$(cargo tree --locked --target wasm32-unknown-unknown -e normal --no-default-features \
                      -p "$package" --prefix none) || {
              echo "::error::cargo tree failed, so the wasm32 graph of $package was not checked"
              exit 1
            }
            for krate in ring aws-lc-sys aws-lc-rs mio sqlx sqlx-core; do
              if grep -q "^$krate v" <<<"$graph"; then
                echo "::error::$krate is in the wasm32 dependency graph of $package"
                cargo tree --locked --target wasm32-unknown-unknown -e normal --no-default-features \
                  -p "$package" -i "$krate@$(grep -m1 "^$krate v" <<<"$graph" | cut -d' ' -f2 | tr -d v)"
                status=1
              fi
            done
          done
          exit $status

      # A Worker verifies tokens with jsonwebtoken 10 and RustCrypto, where the
      # server uses jsonwebtoken 9 and ring. The test-only feature switches a
      # native build to the Worker's path, so the auth tests cover both.
      - name: Auth tests (jsonwebtoken 10, the Worker's backend)
        run: cargo test --locked -p postrust-auth --features jwt-rust-crypto

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (from rust-toolchain.toml)
        run: rustup show active-toolchain

      - uses: Swatinem/rust-cache@v2
        with:
          key: audit

      # ^0.22 specifically: 0.21 cannot parse a CVSS 4.0 advisory and dies
      # with "unsupported CVSS version: 4.0" on the current RustSec database,
      # which would have made this job red on its first run for a reason
      # unrelated to our dependencies.
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --version ^0.22

      # Advisories against the lockfile, plus yanked crates -- a yanked
      # dependency is how a lockfile rots quietly.
      #
      # This reports what is *locked*, which is not the same as what is
      # compiled: an advisory against an optional dependency that no enabled
      # feature pulls in is worth fixing but is not an exposure. Check
      # `cargo tree -i <crate>` before treating one as reachable. SECURITY.md
      # explains why, with the quinn-proto case that prompted it.
      # Ignores live in .cargo/audit.toml, one documented reason each.
      - name: cargo audit
        run: cargo audit --deny warnings

  test:
    name: build + test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postrust_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postrust_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postrust_test
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (from rust-toolchain.toml)
        run: rustup show active-toolchain

      - uses: Swatinem/rust-cache@v2

      - name: Build (default features)
        run: cargo build --workspace --all-targets

      - name: Build (server, admin-ui feature)
        run: cargo build -p postrust-server --features admin-ui

      - name: Test (unit + doc, no database required)
        run: cargo test --workspace

      - name: Load database schema
        run: |
          set -euo pipefail
          for f in scripts/init-db.sql scripts/test-fixtures.sql; do
            if [ -f "$f" ]; then
              PGPASSWORD=postgres psql -h localhost -U postgres -d postrust_test -v ON_ERROR_STOP=1 -f "$f"
            fi
          done

      - name: Integration tests (database-backed)
        # --lib/--bins/--tests keeps doctests out of this pass: `-- --ignored`
        # would otherwise also run doc examples marked `ignore`, which are
        # sketches that don't compile.
        run: cargo test --workspace --lib --bins --tests -- --ignored

      # `compat-key-order` changes the response byte-for-byte, and had no
      # coverage here at all -- which is how embedded rows came to be built as
      # `jsonb`, whose keys PostgreSQL sorts by length and then bytes. The
      # feature's own test said so and nothing ran it.
      #
      # Named explicitly rather than `--all-features`: that would also turn on
      # `pebble-tests`, which needs a live certificate authority and is meant
      # to be run by scripts/acme/run.sh.
      - name: Integration tests (compat-key-order)
        run: |
          cargo test -p postrust-server --features compat-key-order \
            --lib --bins --tests -- --ignored

      # `pg-socket` serves REST requests through the socket driver a
      # Cloudflare Worker uses, which pipelines a request's statements and
      # owns the transaction they run in. Run over the server's whole suite,
      # so that a refused write is proved to roll back on that driver too, and
      # every request answers as it does on sqlx.
      - name: Integration tests (pg-socket)
        run: |
          cargo test -p postrust-server --features pg-socket \
            --lib --bins --tests -- --ignored
