name: Serverless

# The serverless adapters, each in the runtime it runs in, against PostgreSQL
# with row-level security:
#
# * Lambda, built with cargo-lambda and run in AWS's provided:al2023 image. It
#   used to carry a request path of its own that bound no parameters and
#   switched to no role, and nothing ran it; this is what runs it.
# * The Cloudflare Worker, built with worker-build and served by
#   `wrangler dev` -- workerd, the Workers runtime -- reaching the database
#   through a Hyperdrive binding.

on:
  pull_request:
    paths:
      - ".github/workflows/serverless.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/postrust-auth/**"
      - "crates/postrust-core/**"
      - "crates/postrust-engine/**"
      - "crates/postrust-graphql/**"
      - "crates/postrust-lambda/**"
      - "crates/postrust-response/**"
      - "crates/postrust-server/**"
      - "crates/postrust-sql/**"
      - "crates/postrust-worker/**"
      - "scripts/serverless/**"
  push:
    branches: [main]
    paths:
      - "crates/postrust-lambda/**"
      - "crates/postrust-worker/**"
      - "scripts/serverless/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: serverless-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lambda:
    name: Lambda in the runtime emulator
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Build and test
        run: scripts/serverless/lambda.sh

  worker:
    name: Cloudflare Worker in workerd
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Build and test
        run: scripts/serverless/worker.sh
