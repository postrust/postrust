name: Release

on:
  push:
    tags:
      - "v*"
  # Can also be dispatched manually against an existing tag ref from the Actions UI.
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Docker Hub is the only registry images are published to.
  # docs/deployment.md, charts/postrust/values.yaml and the website all tell
  # people to run `postrust/postrust`, which is here, so this is the one that
  # has to work -- `helm install` cannot pull its own default image otherwise.
  DOCKERHUB_IMAGE: postrust/postrust

jobs:
  crates:
    name: Publish crates to crates.io
    # Only publish from version tags; a manual dispatch must target a tag ref.
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Publish (dependency order, skipping already-published versions)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          metadata=$(cargo metadata --no-deps --format-version 1)
          version=$(jq -r '.packages[] | select(.name == "postrust-core") | .version' <<<"${metadata}")
          echo "Workspace version: ${version}"

          # The tag is the source of truth for a release; refuse to publish if
          # the workspace version wasn't bumped to match it (e.g. tagging
          # v0.2.3 while Cargo.toml still says 0.2.2). Anchored on
          # postrust-core, which carries [workspace.package] version.
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "${tag_version}" != "${version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match workspace version ${version}." \
                 "Bump [workspace.package] version in Cargo.toml before tagging."
            exit 1
          fi

          # Each crate is published at the version *it* declares, not at the
          # workspace version: postrust-proxy sets its own, on a 0.x line that
          # carries no stability promise (see docs/stability.md). A tag ships
          # whatever every crate currently declares and skips what is already
          # published, so the proxy releases on the same tags without being
          # dragged along to 1.0.0.
          #
          # Dependency order: leaves first. Nothing depends on postrust-proxy,
          # so no 1.0.0 crate carries a 0.x dependency.
          for crate in postrust-sql postrust-auth postrust-core postrust-response \
                       postrust-graphql postrust-server postrust-lambda postrust-worker \
                       postrust-proxy; do
            crate_version=$(jq -r --arg c "${crate}" \
              '.packages[] | select(.name == $c) | .version' <<<"${metadata}")
            if [ -z "${crate_version}" ] || [ "${crate_version}" = "null" ]; then
              echo "::error::No version found for ${crate} in cargo metadata."
              exit 1
            fi
            if curl -fsS -A "postrust-release-workflow (github.com/${GITHUB_REPOSITORY})" \
                 "https://crates.io/api/v1/crates/${crate}/${crate_version}" >/dev/null 2>&1; then
              echo "${crate} ${crate_version} already on crates.io, skipping"
              continue
            fi
            echo "Publishing ${crate} ${crate_version}"
            cargo publish -p "${crate}" --locked
          done

  image:
    name: Image (${{ matrix.variant }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # Whether Docker Hub is configured, as a plain boolean. The `secrets`
      # context is not dependably available in a step-level `if`, and the
      # secret's *value* must never reach a `run:` command line even though
      # Actions would mask it in the log.
      HAS_DOCKERHUB: ${{ secrets.DOCKERHUB_TOKEN != '' }}
    strategy:
      # Publish whichever variant builds. One failing should not withhold the
      # other from people who can use it.
      fail-fast: false
      matrix:
        include:
          - variant: debian
            dockerfile: ./Dockerfile
            flavor: ""
          - variant: alpine
            dockerfile: ./Dockerfile.alpine
            # onlatest so the floating tag is `latest-alpine`, not `latest`.
            # Without it both variants would race for `latest` and the winner
            # would be whichever job finished second.
            flavor: suffix=-alpine,onlatest=true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Docker Hub is the only registry now, so a missing secret means the
      # release would publish nothing at all. Say so here rather than let the
      # push fail further down with an authorization error that reads like a
      # bad password.
      - name: Require Docker Hub credentials
        run: |
          if [ "${HAS_DOCKERHUB}" != "true" ]; then
            echo "::error::DOCKERHUB_TOKEN is not set, so this release would publish no images." \
                 "Set DOCKERHUB_USERNAME and DOCKERHUB_TOKEN, with a token scoped Read & Write."
            exit 1
          fi

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: docker.io/${{ env.DOCKERHUB_IMAGE }}
          flavor: ${{ matrix.flavor }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=tag
            # A prerelease must not become `latest`: a semver prerelease always
            # carries a hyphen (1.0.0-alpha.1), and `docker pull postrust:latest`
            # has to keep meaning the newest release people should run.
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' && !contains(github.ref_name, '-') }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}

  # A push succeeding proves the workflow could write, not that anybody else
  # can read -- a private repository is a way for a release to go green while
  # `docker pull` fails for every user. So the tags are pulled back with no
  # credentials at all.
  #
  # Its own job, and not a gate on the release: by the time this runs the
  # crates are already on crates.io, so withholding the GitHub Release would
  # leave the worse mess. It fails loudly and separately instead.
  verify:
    name: Images are pullable by strangers
    needs: image
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - name: Pull anonymously
        run: |
          set -uo pipefail
          docker logout >/dev/null 2>&1 || true

          version="${GITHUB_REF_NAME#v}"
          failed=0

          check() {
            local ref="$1"
            if docker pull --quiet "$ref" >/dev/null 2>&1; then
              echo "ok       $ref"
            else
              echo "::error::$ref is not pullable without credentials"
              failed=1
            fi
          }

          check "docker.io/${{ env.DOCKERHUB_IMAGE }}:${version}"
          check "docker.io/${{ env.DOCKERHUB_IMAGE }}:${version}-alpine"

          if [ "$failed" -ne 0 ]; then
            echo "::error::The repository at https://hub.docker.com/r/${{ env.DOCKERHUB_IMAGE }}" \
                 "has to be public, and the push has to have actually happened."
            exit 1
          fi

  release:
    name: GitHub Release
    needs: image
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          # A semver prerelease always carries a hyphen (1.0.0-alpha.1). Without
          # these two, the release publishes as a normal one and GitHub shows it
          # as `Latest` -- so an alpha becomes what `releases/latest` returns and
          # what the repository front page offers. Both had to be corrected by
          # hand after 1.0.0-alpha.1 shipped. The `latest` container tag in the
          # `image` job is gated on the same test, for the same reason.
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}
          body: |
            ## Container images

            Two variants of the same build. The Alpine one is much smaller; the
            Debian one is the default because it is the one the throughput
            figures were measured on.

            ```
            docker pull ${{ env.DOCKERHUB_IMAGE }}:${{ github.ref_name }}
            docker pull ${{ env.DOCKERHUB_IMAGE }}:${{ github.ref_name }}-alpine
            ```
