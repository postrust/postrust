[workspace]
resolver = "2"
members = [
    "crates/postrust-core",
    "crates/postrust-sql",
    "crates/postrust-auth",
    "crates/postrust-response",
    "crates/postrust-engine",
    "crates/postrust-server",
    "crates/postrust-lambda",
    "crates/postrust-worker",
    "crates/postrust-graphql",
    "crates/postrust-proxy",
]
# A crate of its own, depending on postrust-server as a project of yours would.
# Not a member because every Dockerfile here copies `Cargo.toml` and `crates/`
# and nothing else, and a member missing from the build context fails the whole
# build. CI builds and lints it with `--manifest-path`.
exclude = ["examples/custom-routes"]

[workspace.package]
version = "3.0.0"
edition = "2021"
# Verified, not assumed: 1.94.0 builds the workspace clean, and anything older
# is refused outright -- sqlx 0.9 declares 1.94, and every crate here that
# reaches a database (the server, the Lambda adapter, GraphQL, the proxy, and
# postrust-core with its default `sqlx` feature) depends on it. The floor moved
# from 1.88 to 1.94 in 3.0 with the move to sqlx 0.9; before that it was
# hickory-{net,proto,resolver} 0.26 and time 0.3.55, both at 1.88 and both
# arriving with security updates, that moved it up from 1.86. The README
# claimed 1.78, and the docs 1.75, before this was declared anywhere at all.
rust-version = "1.94"
license = "MIT"
repository = "https://github.com/postrust/postrust"
homepage = "https://postrust.org/"
authors = ["Bhanu Pratap Chaudhary"]

[workspace.dependencies]
# Async runtime
#
# Only what the request-handling crates need. `full` pulls in mio, which has no
# networking on wasm32, so the crates that serve or connect (server, Lambda,
# proxy, GraphQL) ask for it themselves. A Cloudflare Worker builds
# postrust-core and its siblings without it -- see issue #50. At least 1.54.1
# for RUSTSEC-2026-0386.
tokio = { version = "1.54.1", default-features = false, features = ["sync", "macros"] }
async-trait = "0.1"
futures = "0.3"

# Web framework
axum = { version = "0.8", features = ["macros"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "trace", "compression-gzip"] }
hyper = { version = "1.5", features = ["full"] }

# Database
#
# `tls-rustls-ring-native-roots` and not an aws-lc-rs variant, which would
# otherwise match the provider the rest of the tree is pinned to. The choice is
# forced, and sqlx 0.9 kept it so: its rustls connector reads the system trust
# store only when the optional `rustls-native-certs` dependency is compiled in
# (`import_root_certs()` in sqlx-core's src/net/tls/tls_rustls.rs is gated on
# it), and the only feature that turns that on is this one, by way of
# `sqlx-core/_tls-rustls-ring-native-roots`. `tls-rustls-aws-lc-rs` gets
# webpki's bundled roots and nothing else, as does `tls-rustls`, which is now
# an alias for `tls-rustls-ring-webpki`. Native roots is the one that works for
# a database behind a private or organisation-issued CA, and both runtime images
# already ship `ca-certificates` (see ./Dockerfile and ./Dockerfile.alpine).
# The trust store is what `sslmode=verify-ca` and `verify-full` check against;
# `require` encrypts without verifying, so it works whatever the store holds.
#
# 0.9 also deleted the old combined features (`runtime-tokio-rustls` and the
# like). The runtime and the TLS stack were already named separately here, so
# nothing else had to move.
#
# This costs nothing and risks nothing. `ring` was already compiled in --
# reqwest pulls it, so rustls has had both features on for as long as the proxy
# has existed (see the comment on `install_crypto_provider` in
# crates/postrust-proxy/src/tls/server.rs). And sqlx selects its provider
# explicitly via `ClientConfig::builder_with_provider`, so it cannot collide
# with the aws-lc-rs provider that crate installs process-wide.
#
# Without a TLS feature sqlx does not merely lack the option: `sslmode=require`
# fails outright with "SQLx was built without TLS support enabled", and the
# default `sslmode=prefer` silently connects in cleartext.
sqlx = { version = "0.9", features = ["runtime-tokio", "tls-rustls-ring-native-roots", "postgres", "json", "chrono", "uuid", "bigdecimal"] }
deadpool-postgres = "0.14"
tokio-postgres = "0.7"

# Serialization
serde = { version = "1.0", features = ["derive"] }
# arbitrary_precision keeps NUMERIC values as the digits PostgreSQL sent,
# rather than routing them through f64 on the way to JSON.
# arbitrary_precision keeps NUMERIC values as the digits PostgreSQL sent, rather
# than routing them through f64 on the way to JSON.
#
# Key ordering is a build-time choice, not a runtime one: it depends on whether
# serde_json's Map is a BTreeMap or an IndexMap. See the `compat-key-order`
# feature on postrust-server.
serde_json = { version = "1.0", features = ["arbitrary_precision"] }

# Parsing
nom = "7.1"

# Authentication
jsonwebtoken = "9.3"
base64 = "0.22"

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Utilities
indexmap = { version = "2.7", features = ["serde"] }
bytes = { version = "1.9", features = ["serde"] }
http = "1.2"
mime = "0.3"
url = "2.5"
percent-encoding = "2.3"
tracing = "0.1"
# `json` for `PGRST_LOG_FORMAT=json`. tracing-serde, which it adds, was
# already in the tree through the Lambda runtime.
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
# Default features kept: `wasmbind` is one, and gives chrono its clock on
# wasm32 (a Cloudflare Worker, issue #50).
chrono = { version = "0.4", features = ["serde"] }
# `std::time`'s clocks panic on wasm32-unknown-unknown; this is `std::time`
# everywhere else and the JavaScript clock there.
web-time = "1.1"
uuid = { version = "1.11", features = ["v4", "v5", "serde"] }

# Testing
pretty_assertions = "1.4"

# TLS/Crypto
tokio-rustls = "0.26"
rustls = { version = "0.23", default-features = false, features = ["std", "aws_lc_rs"] }
rustls-pemfile = "2"

# OpenTelemetry: traces and metrics over OTLP, and metrics as Prometheus text.
# Only the `otel` feature of postrust-server (and postrust-lambda) pulls these
# in; see that feature's comment for why each is what it is. `gzip-http` for
# `OTEL_EXPORTER_OTLP_COMPRESSION=gzip`: flate2 is already in the server
# through tower-http's response compression.
opentelemetry = { version = "0.33.1", default-features = false, features = ["trace", "metrics"] }
opentelemetry_sdk = { version = "0.33.1", default-features = false, features = ["trace", "metrics"] }
opentelemetry-otlp = { version = "0.33.1", default-features = false, features = ["http-proto", "gzip-http", "trace", "metrics", "internal-logs"] }
opentelemetry-http = { version = "0.33.1", default-features = false }
tracing-opentelemetry = { version = "0.34.0", default-features = false, features = ["metrics"] }
opentelemetry-prometheus = { version = "0.33.1", default-features = false }
prometheus = { version = "0.14", default-features = false }

# HTTP client
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

# ACME (Let's Encrypt). The `rcgen` feature makes `Order::finalize` build the
# CSR and hand back the private key as PEM, so rcgen does not need to be a
# direct dependency -- declaring it separately resolved a *second* rcgen
# alongside instant-acme's own. `aws-lc-rs` keeps it on the crypto provider
# already in the tree rather than adding a second backend.
instant-acme = { version = "0.8", default-features = false, features = [
    "aws-lc-rs",
    "hyper-rustls",
    "rcgen",
] }
# Reading `notAfter` out of an issued chain, so renewal can be scheduled.
x509-parser = "0.18"

hyper-util = { version = "0.1", features = ["full"] }
http-body = "1"
http-body-util = "0.1"

# Hot-reload

# Concurrent data structures
dashmap = "6"
parking_lot = "0.12"

# Config
toml = "0.8"

# Route matching: `path_type = "regex"`. Already in the tree transitively, so
# this adds no new compilation.
regex = "1"

# Internal crates
# Without sqlx by default, so a member that must not link it (the Worker, on
# wasm32) can leave it out; the ones that load a schema cache or decode rows ask
# for `features = ["sqlx"]`. The crate's own default keeps sqlx on for anybody
# depending on it from crates.io.
postrust-core = { version = "3.0.0", path = "crates/postrust-core", default-features = false }
postrust-sql = { version = "3.0.0", path = "crates/postrust-sql" }
postrust-auth = { version = "3.0.0", path = "crates/postrust-auth" }
postrust-response = { version = "3.0.0", path = "crates/postrust-response" }
postrust-engine = { version = "3.0.0", path = "crates/postrust-engine" }
postrust-graphql = { version = "3.0.0", path = "crates/postrust-graphql" }
postrust-server = { version = "3.0.0", path = "crates/postrust-server" }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true

# wasm-bindgen reads tables and sections out of the module that stripping
# removes, and fails with "externref table required for catch wrappers".
# worker-build shrinks the module itself with wasm-opt.
[profile.release.package.postrust-worker]
strip = false
