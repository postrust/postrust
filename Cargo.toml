[workspace]
resolver = "2"
members = [
    "crates/postrust-core",
    "crates/postrust-sql",
    "crates/postrust-auth",
    "crates/postrust-response",
    "crates/postrust-server",
    "crates/postrust-lambda",
    "crates/postrust-worker",
    "crates/postrust-graphql",
    "crates/postrust-proxy",
]

[workspace.package]
version = "1.0.0-alpha.2"
edition = "2021"
# Verified, not assumed: 1.88.0 builds the workspace clean and 1.87.0 is
# refused outright -- hickory-{net,proto,resolver} 0.26 and time 0.3.55 all
# declare 1.88. Both arrived with security updates, and the floor moved from
# 1.86 to 1.88 as a result; the advisories were worth more than the two
# releases. The README claimed 1.78, and the docs 1.75, before this was
# declared anywhere at all.
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/postrust/postrust"
homepage = "https://postrust.org/"
authors = ["Bhanu Pratap Chaudhary"]

[workspace.dependencies]
# Async runtime
tokio = { version = "1.43", features = ["full"] }
async-trait = "0.1"
futures = "0.3"

# Web framework
axum = { version = "0.8", features = ["macros"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "trace", "compression-gzip"] }
hyper = { version = "1.5", features = ["full"] }

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "json", "chrono", "uuid", "bigdecimal"] }
deadpool-postgres = "0.14"
tokio-postgres = "0.7"

# Serialization
serde = { version = "1.0", features = ["derive"] }
# arbitrary_precision keeps NUMERIC values as the digits PostgreSQL sent,
# rather than routing them through f64 on the way to JSON.
# arbitrary_precision keeps NUMERIC values as the digits PostgreSQL sent, rather
# than routing them through f64 on the way to JSON.
#
# Key ordering is a build-time choice, not a runtime one: it depends on whether
# serde_json's Map is a BTreeMap or an IndexMap. See the `compat-key-order`
# feature on postrust-server.
serde_json = { version = "1.0", features = ["arbitrary_precision"] }

# Parsing
nom = "7.1"

# Authentication
jsonwebtoken = "9.3"
base64 = "0.22"

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Utilities
indexmap = { version = "2.7", features = ["serde"] }
bytes = { version = "1.9", features = ["serde"] }
http = "1.2"
mime = "0.3"
url = "2.5"
percent-encoding = "2.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.11", features = ["v4", "v5", "serde"] }

# Testing
pretty_assertions = "1.4"

# TLS/Crypto
tokio-rustls = "0.26"
rustls = { version = "0.23", default-features = false, features = ["std", "aws_lc_rs"] }
rustls-pemfile = "2"

# HTTP client
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

# ACME (Let's Encrypt). The `rcgen` feature makes `Order::finalize` build the
# CSR and hand back the private key as PEM, so rcgen does not need to be a
# direct dependency -- declaring it separately resolved a *second* rcgen
# alongside instant-acme's own. `aws-lc-rs` keeps it on the crypto provider
# already in the tree rather than adding a second backend.
instant-acme = { version = "0.8", default-features = false, features = [
    "aws-lc-rs",
    "hyper-rustls",
    "rcgen",
] }
# Reading `notAfter` out of an issued chain, so renewal can be scheduled.
x509-parser = "0.18"

hyper-util = { version = "0.1", features = ["full"] }
http-body-util = "0.1"

# Hot-reload
notify = "7"

# Concurrent data structures
dashmap = "6"
parking_lot = "0.12"

# Config
toml = "0.8"

# Internal crates
postrust-core = { version = "1.0.0-alpha.2", path = "crates/postrust-core" }
postrust-sql = { version = "1.0.0-alpha.2", path = "crates/postrust-sql" }
postrust-auth = { version = "1.0.0-alpha.2", path = "crates/postrust-auth" }
postrust-response = { version = "1.0.0-alpha.2", path = "crates/postrust-response" }
postrust-graphql = { version = "1.0.0-alpha.2", path = "crates/postrust-graphql" }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
