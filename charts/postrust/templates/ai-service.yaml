{{- if .Values.ai.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "postrust.ai.fullname" . }}
  labels:
    {{- include "postrust.ai.labels" . | nindent 4 }}
spec:
  type: {{ .Values.ai.service.type }}
  ports:
    - port: {{ .Values.ai.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "postrust.ai.selectorLabels" . | nindent 4 }}
{{- end }}
