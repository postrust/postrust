apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "postrust.fullname" . }}
  labels:
    {{- include "postrust.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      {{- include "postrust.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "postrust.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: postrust
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.server.port }}
              protocol: TCP
          env:
            # The server binds 127.0.0.1 by default, which inside a container
            # means the Service reaches nothing.
            - name: PGRST_SERVER_HOST
              value: "0.0.0.0"
            - name: PGRST_SERVER_PORT
              value: {{ .Values.server.port | quote }}
            - name: PGRST_DB_SCHEMAS
              value: {{ .Values.server.schemas | quote }}
            - name: PGRST_DB_ANON_ROLE
              value: {{ .Values.auth.anonRole | quote }}
            - name: PGRST_LOG_LEVEL
              value: {{ .Values.server.logLevel | quote }}
            {{- if .Values.server.compatMode }}
            - name: PGRST_COMPAT_MODE
              value: "true"
            {{- end }}
            {{- if .Values.server.maxRows }}
            - name: PGRST_DB_MAX_ROWS
              value: {{ .Values.server.maxRows | quote }}
            {{- end }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "postrust.secretName" . }}
                  key: DATABASE_URL
            {{- if or .Values.auth.jwtSecret .Values.database.existingSecret }}
            - name: PGRST_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "postrust.secretName" . }}
                  key: PGRST_JWT_SECRET
                  optional: true
            {{- end }}
          # Both endpoints come from the built-in custom routes: /_/health
          # reports the process is up, /_/ready also checks the database, which
          # is what should gate traffic.
          livenessProbe:
            httpGet:
              path: /_/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /_/ready
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
