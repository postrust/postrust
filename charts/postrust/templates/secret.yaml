{{- if not .Values.database.existingSecret }}
{{- if not .Values.database.url }}
{{- fail "set database.url, or point database.existingSecret at a Secret holding DATABASE_URL" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "postrust.fullname" . }}
  labels:
    {{- include "postrust.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ .Values.database.url | quote }}
  {{- if .Values.auth.jwtSecret }}
  PGRST_JWT_SECRET: {{ .Values.auth.jwtSecret | quote }}
  {{- end }}
{{- end }}
