services:
  postgres:
    image: postgres:16-alpine
    container_name: postrust-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postrust_test
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./scripts/test-fixtures.sql:/docker-entrypoint-initdb.d/02-fixtures.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postrust_test"]
      interval: 5s
      timeout: 5s
      retries: 5

  postrust:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: postrust-server
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/postrust_test
      PGRST_DB_SCHEMAS: public,api
      PGRST_DB_ANON_ROLE: web_anon
      PGRST_JWT_SECRET: super-secret-jwt-key-for-testing-only-32-chars
      PGRST_SERVER_HOST: 0.0.0.0
      PGRST_SERVER_PORT: 3000
      PGRST_LOG_LEVEL: info
      PGRST_DEBUG: "true"
      RUST_LOG: info
    ports:
      - "3000:3000"

  # Test runner service
  test:
    build:
      context: .
      dockerfile: Dockerfile.test
    container_name: postrust-test
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/postrust_test
      RUST_LOG: debug
      RUST_BACKTRACE: 1
    volumes:
      - .:/app
      - cargo_cache:/usr/local/cargo/registry
      - target_cache:/app/target
    working_dir: /app
    command: cargo test --all

  # --- AI node (profile: ai) ----------------------------------------------
  # postrust-ai, on the compose Postgres. Not started by default:
  #
  #   docker compose --profile ai up ai
  #
  # The config declares no models, so it is healthy with nothing else running.
  # The image has no model servers in it; to serve a model, run one beside it
  # and declare it as `attached` (see the comments in the config file), or build
  # an image FROM postrust/postrust-ai that has the server installed.
  #
  # It shares postrust_test with the other services; its tables live in schema
  # `ai`, which it creates.
  ai:
    build:
      context: .
      dockerfile: Dockerfile.ai
    container_name: postrust-ai
    profiles: ["ai"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/postrust_test
      POSTRUST_AI_CONFIG: /etc/postrust-ai/postrust-ai.toml
      POSTRUST_AI_NODE_ID: compose-ai-1
      # Already the image's default; the advertise URL is what peers and the
      # proxy use to reach this node, so it has to be a name they can resolve.
      POSTRUST_AI_LISTEN: 0.0.0.0:7700
      POSTRUST_AI_ADVERTISE_URL: http://ai:7700
      # With no secret the API is open. Fine on a laptop; set one otherwise.
      # POSTRUST_AI_JWT_SECRET: super-secret-jwt-key-for-testing-only-32-chars
      RUST_LOG: info
    ports:
      - "7700:7700"
    volumes:
      - ./crates/postrust-ai/examples/postrust-ai.compose.toml:/etc/postrust-ai/postrust-ai.toml:ro
      - ai_cache:/var/cache/postrust-ai
    healthcheck:
      # /readyz checks the database; /healthz would stay green without it.
      test: ["CMD", "curl", "-f", "http://localhost:7700/readyz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    # A GPU for `process` models, once the image has a server that uses one.
    # Needs the NVIDIA Container Toolkit on the host.
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  # --- ACME testing (profile: acme) ---------------------------------------
  # Pebble is Let's Encrypt's test CA. It deliberately misbehaves -- it rejects
  # a percentage of nonces, varies challenge ordering, and returns states a
  # happy-path client will not expect -- which is the point: it breaks ACME
  # clients that only handle the good case. Nothing in postrust-proxy has
  # talked to a CA yet, so this is where that starts.
  #
  # Static IPs are required because pebble takes -dnsserver as an address, and
  # challtestsrv answers every DNS query with -defaultIPv4. Point that at the
  # container running the proxy so http-01 validation reaches it:
  #
  #   curl -X POST http://localhost:8055/set-default-ipv4 \
  #        -d '{"ip":"10.30.50.4"}'
  #
  # The ACME directory is https://localhost:14000/dir and is served with a
  # self-signed chain. Clients must trust pebble's root, fetched from the
  # management API:
  #
  #   curl -sk https://localhost:15000/roots/0 > pebble-root.pem
  #
  # Start with:  docker compose --profile acme up pebble challtestsrv
  pebble:
    image: ghcr.io/letsencrypt/pebble:latest
    container_name: postrust-pebble
    profiles: ["acme"]
    command: -config test/config/pebble-config.json -strict -dnsserver 10.30.50.3:8053
    ports:
      - "14000:14000"   # ACME directory (HTTPS)
      - "15000:15000"   # management API (HTTPS)
    networks:
      acmenet:
        ipv4_address: 10.30.50.2

  challtestsrv:
    image: ghcr.io/letsencrypt/pebble-challtestsrv:latest
    container_name: postrust-challtestsrv
    profiles: ["acme"]
    command: -defaultIPv6 "" -defaultIPv4 10.30.50.3
    ports:
      - "8055:8055"     # management API (HTTP)
    networks:
      acmenet:
        ipv4_address: 10.30.50.3


volumes:
  postgres_data:
  cargo_cache:
  target_cache:
  ai_cache:

networks:
  # Fixed subnet so pebble's -dnsserver and challtestsrv's -defaultIPv4 can be
  # written as literal addresses. 10.30.50.4 is left free for the proxy under
  # test to join when answering http-01 challenges.
  acmenet:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 10.30.50.0/24
